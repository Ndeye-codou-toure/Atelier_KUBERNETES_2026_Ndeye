# Exercice 4 — Le Deployment de votre site.
# kubectl apply -f k8s/site/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  labels:
    app: site
spec:
  replicas: 3                      # Exercice 5 : vous changerez cette valeur
  selector:
    matchLabels:
      app: site                    # correspond aux labels du template ci-dessous
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.28        # version précise, pas "latest"
          ports:
            - containerPort: 80    # port d'écoute de nginx
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html   # dossier servi par nginx
          # Bonus B : trafic envoyé uniquement aux pods prêts
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          # Bonus B : ressources réservées / maximales
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: site-html        # la ConfigMap de configmap.yaml